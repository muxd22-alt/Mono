name: Score inbox item

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Score, route, and file
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/score_issue.py

      - name: Update daily digest
        run: python scripts/daily_digest.py

      - name: Commit knowledge base entry and digest data
        run: |
          git config user.name "mono-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge_base.jsonl data/
          git diff --cached --quiet || git commit -m "File entry and digest from issue #${{ github.event.issue.number }}"
          git push
