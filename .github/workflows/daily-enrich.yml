name: Daily enrichment & digest

on:
  schedule:
    # Every day at 04:00 UTC (07:00 Saudi time)
    - cron: "0 4 * * *"
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enrich repos from both accounts
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/enrich_repos.py

      - name: Generate daily digest
        run: python scripts/daily_digest.py

      - name: Commit data
        run: |
          git config user.name "mono-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily enrichment $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: enrich
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest
        run: git pull origin main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
